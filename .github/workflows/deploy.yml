name: deploy

# This site's deploy: the shared GitHub Pages workflow in calypsoGrammar/deploy-workflows (README there).
# Actions → deploy → Run workflow (a dry run unless unticked). An earlier `ref` rolls back; tick `rollback`
# with no ref to go back to the `stable` tag, which also holds publishing until cleared.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        type: choice
        options: [production]
        default: production
      dry_run:
        description: 'Dry run: build and check, publish nothing'
        type: boolean
        default: true
      ref:
        description: 'Commit, tag or branch to publish (empty = main; with rollback, empty = stable)'
        type: string
        default: ''
      rollback:
        description: 'Rollback: allowed while production is held, and holds it afterwards'
        type: boolean
        default: false

permissions:
  contents: write
  checks: read
  deployments: write
  pages: write
  id-token: write

jobs:
  deploy:
    uses: calypsoGrammar/deploy-workflows/.github/workflows/github-pages.yml@v1
    with:
      target: ${{ inputs.target }}
      ref: ${{ inputs.ref }}
      dry_run: ${{ inputs.dry_run }}
      rollback: ${{ inputs.rollback }}
      # The check runs that must have passed on the commit (the job names in CI).
      required_checks: |
        build
      build_command: |
        npm ci --no-audit --no-fund
        npm run build
      site_path: dist
