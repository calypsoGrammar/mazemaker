name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Archon's own pull requests are verified on the droplet before they are published
    # (archon.verify posts this check's status); this job runs on main and on people's pull requests.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'archon/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Test
        env:
          REQUIRE_BROWSER: '1'
        run: npm test
      - name: Build
        run: npm run build
      - name: Check the build loads under /mazemaker/
        run: npm run check:dist
