<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="./src/stylesheets/style.css">
    <title>Maze Maker</title>
  </head>
  <body class='min-h-screen max-h-screen'>

      <div class="flex flex-row justify-center items-center border-b border-black">
        <div class="flex w-full max-w-7xl h-full flex-row justify-center mx-auto sm:px-6 lg:px-8" style="height:calc(var(--vh) * 7.5)">
          <button id="ResetButton" aria-label="Restart this maze" title="Restart this maze" class="flex justify-center items-center mx-2 active:scale-95"><img class="w-3/4 h-3/4" src="./src/public/undoLight.svg" alt=""></button>
          <button id="NewMazeButton" aria-label="New maze" title="New maze" class="flex justify-center items-center mx-2 active:scale-95"><img class="w-3/4 h-3/4" src="./src/public/newLight.svg" alt=""></button>
          <button id="ControllerButton" aria-label="Show or hide the movement controls" title="Show or hide the movement controls" class="flex justify-center items-center mx-2 active:scale-95"><img class="w-3/4 h-3/4" src="./src/public/gamesLight.svg"></button>
          <button id="OptionsButton" class="flex justify-center items-center mx-2 active:scale-95"><img class="w-3/4 h-3/4" src="./src/public/optionsLight.svg"></button>
          <button id="SearchButton" class="flex justify-center items-center mx-2 active:scale-95"><img class="w-3/4 h-3/4" src="./src/public/searchLight.svg"></button>
          <button id="ResetViewButton" aria-label="Fit maze to screen" title="Fit maze to screen" class="flex justify-center items-center mx-2 active:scale-95"><img class="w-3/4 h-3/4" src="./src/public/fitLight.svg" alt=""></button>
        </div>
      </div>
    
      <div id="settingsMenu" class="fixed z-10 bg-white flex w-full h-full flex-col justify-start mx-auto overflow-y-auto">
    
        <div class="mx-auto mb-4 mt-8">
          <label for="display001" class="mr-8">Maze Size:</label>
          <input type="number" id="display001" name="display001" min="2" max="50" step="1" inputmode="numeric" aria-describedby="sizeError" class="text-center w-24 rounded border border-black">
        </div>

        <p id="sizeError" role="alert" class="mx-auto text-red-700">Enter a whole number from 2 to 50.</p>

        <div class="mx-auto my-4">
          <label for="mazeShape" class="mr-8">Shape:</label>
          <select id="mazeShape" name="mazeShape" class="text-center w-24 rounded border border-black bg-white">
            <option value="square">Square</option>
            <option value="hex">Hexagon</option>
            <option value="triangle">Triangle</option>
          </select>
        </div>

        <div class="mx-auto my-4">
          <label for="autonew" class="mr-8">Auto-new:</label>
          <input type="checkbox" id="autonew" name="autonew" class='hover:scale-105' checked>
        </div>
    
        <div class="mx-auto my-4">
          <label for="autoincrement" class="mr-8">Auto-increment:</label>
          <input type="checkbox" id="autoincrement" name="autoincrement" class='hover:scale-105' checked>
        </div>
    
        <button id="generateMaze" class="w-24 h-12 mx-auto my-4 active:scale-95 border border-black rounded-lg hover:scale-105">Generate</button>
    
      </div>
    
      <div id="gameDiv">
        <div id="completeBanner" role="status" class="absolute top-2 left-1/2 -translate-x-1/2 z-10 flex flex-row items-center gap-2 bg-white border border-black rounded-lg px-4 py-2">
          <span>Maze complete!</span>
          <button id="completeRestart" class="px-2 border border-black rounded-lg active:scale-95">Restart</button>
          <button id="completeNew" class="px-2 border border-black rounded-lg active:scale-95">New maze</button>
        </div>
        <div id="canvasHolder">
          <canvas id="ctx" class="mx-auto"></canvas>
        </div>
      </div>
    
      <div id="footerControls">
    
        <svg id="directionPad" aria-label="Movement controls"></svg>
    
      </div>
  </body>
  <script type='module' src="./src/javascripts/main.js"></script>
</html>
